version: 0.2

env:
  parameter-store:
    SONAR_TOKEN: "/cicd/sonar/sonar-token"
    SONAR_HOST_URL: "/cicd/sonar/sonar-host-url"

phases:
  install:
    runtime-versions:
      nodejs: 18

    commands:
      - apt-get update
      - apt-get install -y wget unzip docker.io

      # Install Trivy
      - wget https://github.com/aquasecurity/trivy/releases/download/v0.50.1/trivy_0.50.1_Linux-64bit.tar.gz
      - tar -xzf trivy_0.50.1_Linux-64bit.tar.gz
      - mv trivy /usr/local/bin/

      # Install Sonar Scanner
      - wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-5.0.1.3006-linux.zip
      - unzip sonar-scanner-5.0.1.3006-linux.zip
      - export PATH=$PATH:$(pwd)/sonar-scanner-5.0.1.3006-linux/bin

  pre_build:
    commands:
      - echo Logging into ECR
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - AWS_REGION=ap-south-1
      - ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/swiggy-clone

      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | head -c 7)

  build:
    commands:
      - echo Build started on `date`

      # Trivy filesystem scan
      - trivy fs . > trivyfilescan.txt

      # SonarQube analysis
      - sonar-scanner \
        -Dsonar.projectKey=swiggy-clone \
        -Dsonar.sources=. \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN

      # Docker build
      - docker build -t swiggy-clone:$IMAGE_TAG .

      # Trivy image scan
      - trivy image swiggy-clone:$IMAGE_TAG > trivyimagescan.txt

      # Tag image
      - docker tag swiggy-clone:$IMAGE_TAG $ECR_URI:$IMAGE_TAG

  post_build:
    commands:
      - docker push $ECR_URI:$IMAGE_TAG

      - printf '[{"name":"swiggy","imageUri":"%s"}]' $ECR_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - appspec.yaml
    - imagedefinitions.json
    - trivyfilescan.txt
    - trivyimagescan.txt